<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClaudeOClock</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    width: 240px;
    margin: 0;
    background: #1a1a18;
    color: #faf9f5;
  }
  .header {
    background: #242420;
    padding: 12px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    color: #d97757;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 16px 4px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.green { background: #6a8a4a; }
  .dot.red   { background: #b83030; }
  .dot.gray  { background: #555; }
  .status-label { color: #9b9990; font-size: 12px; }
  .data-block {
    padding: 8px 16px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .metric { display: flex; flex-direction: column; gap: 2px; }
  .metric-label { font-size: 10px; color: #9b9990; text-transform: uppercase; letter-spacing: .5px; }
  .metric-value { font-size: 20px; font-weight: 700; color: #faf9f5; }
  .metric-value.unknown { color: #9b9990; font-size: 13px; font-weight: 400; }
  .section-title { font-size: 10px; color: #d97757; text-transform: uppercase; letter-spacing: .5px; padding: 4px 16px 0; }
  .divider { height: 1px; background: #2a2a26; margin: 8px 16px; }
  .footer { padding: 8px 16px 12px; }
  .footer a { color: #d97757; text-decoration: none; font-size: 11px; }
  .footer a:hover { text-decoration: underline; }
  .last-seen { font-size: 10px; color: #9b9990; padding: 0 16px 8px; }
</style>
</head>
<body>
<div class="header">
  <div class="dot" id="daemon-dot" style="background:#555"></div>
  <h1>ClaudeOClock</h1>
</div>

<div class="status-row">
  <span class="status-label" id="daemon-status">Checking daemon…</span>
</div>
<div class="last-seen" id="last-seen"></div>

<div class="section-title">claude.ai</div>
<div class="data-block">
  <div class="metric">
    <span class="metric-label">Session</span>
    <span class="metric-value" id="ai-session">—</span>
  </div>
  <div class="metric">
    <span class="metric-label">Weekly</span>
    <span class="metric-value" id="ai-weekly">—</span>
  </div>
</div>

<div class="divider"></div>
<div class="footer">
  <a href="https://claude.ai" target="_blank">Open claude.ai</a>
</div>

<script>
  function fmt(v) {
    if (v === -1 || v === null || v === undefined) return { text: '---', cls: 'unknown' };
    return { text: v + '%', cls: '' };
  }

  chrome.runtime.sendMessage({ type: 'GET_STATUS' }, (resp) => {
    if (chrome.runtime.lastError || !resp) return;

    const { lastContact, lastData } = resp;
    const dot = document.getElementById('daemon-dot');
    const statusEl = document.getElementById('daemon-status');
    const lastSeenEl = document.getElementById('last-seen');

    const connected = lastContact && (Date.now() - lastContact) < 3 * 60 * 1000;
    dot.className = 'dot ' + (connected ? 'green' : (lastContact ? 'gray' : 'red'));
    statusEl.textContent = connected ? 'Daemon connected'
      : lastContact ? 'Daemon not seen recently'
      : 'Daemon not running';

    if (lastContact) {
      const ago = Math.round((Date.now() - lastContact) / 1000);
      lastSeenEl.textContent = `Last contact: ${ago < 60 ? ago + 's' : Math.round(ago/60) + 'm'} ago`;
    }

    if (lastData) {
      const s = fmt(lastData.ai_session_pct);
      const w = fmt(lastData.ai_weekly_pct);
      document.getElementById('ai-session').textContent = s.text;
      document.getElementById('ai-session').className = 'metric-value ' + s.cls;
      document.getElementById('ai-weekly').textContent = w.text;
      document.getElementById('ai-weekly').className = 'metric-value ' + w.cls;
    }
  });
</script>
</body>
</html>
